<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Title</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<style> 
    .large-only {
      display: block;
    }
    .small-only {
      display: none;
    }

    @media only screen and (max-width: 800px) {
      .large-only {
        display: none;
      }
      .small-only {
        display: block;
      }
    }
  </style>
</head>
<body>
  <h1 class="large-only">I'm large</h1>
  <h2 class="small-only">I'm small</h2>
</body>


</html>
